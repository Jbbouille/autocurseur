name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.17.1

jobs:
  build-test:
    name: Build et tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Zig ${{ env.ZIG_VERSION }}
        shell: pwsh
        run: |
          $v = $env:ZIG_VERSION
          $zip = Join-Path $env:RUNNER_TEMP "zig.zip"
          Invoke-WebRequest "https://ziglang.org/download/$v/zig-x86_64-windows-$v.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-$v" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Version de Zig
        run: zig version

      - name: Tests unitaires, d'intégration et de performance
        run: zig build test --summary all

      - name: Tests système (curseur réel et exécutable)
        run: zig build test-system --summary all

      - name: Compilation de l'exécutable (ReleaseFast)
        run: zig build --summary all

      - name: Exécutable en artefact
        uses: actions/upload-artifact@v4
        with:
          name: AutoCurseur
          path: zig-out/bin/AutoCurseur.exe

  release:
    name: Release GitHub
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # jeton GitHub (classic, portée public_repo) du compte qui propose les mises à jour
      # à microsoft/winget-pkgs ; sans ce secret, l'étape winget est sautée
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      KOMAC_VERSION: 2.17.2
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer l'exécutable testé
        uses: actions/download-artifact@v4
        with:
          name: AutoCurseur
          path: dist

      - name: Publier la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP "notes.md"
          $sha = (Get-FileHash dist/AutoCurseur.exe -Algorithm SHA256).Hash
          Get-Content .github/release-notes.md -Raw -Encoding utf8 | Out-File $notes -Encoding utf8
          "`nSHA-256 ``AutoCurseur.exe`` : ``$sha```n" | Out-File $notes -Append -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" dist/AutoCurseur.exe --title "AutoCurseur $env:GITHUB_REF_NAME" --notes-file $notes --generate-notes

      - name: Proposer la nouvelle version à winget
        if: env.WINGET_TOKEN != ''
        continue-on-error: true # la release est déjà publiée ; un souci côté winget ne doit pas la marquer en échec
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $komac = Join-Path $env:RUNNER_TEMP "komac.exe"
          Invoke-WebRequest "https://github.com/russellbanks/Komac/releases/download/v$env:KOMAC_VERSION/komac-$env:KOMAC_VERSION-x86_64-pc-windows-msvc.exe" -OutFile $komac
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/AutoCurseur.exe"
          & $komac update Jbbouille.AutoCurseur --version $version --urls $url --submit
